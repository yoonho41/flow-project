<!doctype html>
<html lang="ko"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.min.css" />

  <title layout:fragment="title">파일 확장자 차단 서비스</title>

  <style>
    :root{
      --bg: #f6f8fc;
      --panel: rgba(255,255,255,.78);
      --panel2: rgba(255,255,255,.92);
      --line: rgba(16, 24, 40, .10);
      --text: rgba(16, 24, 40, .92);
      --muted: rgba(16, 24, 40, .62);
      --shadow: 0 10px 30px rgba(16, 24, 40, .10);
      --radius: 14px;
    }
    *{ box-sizing:border-box; }
    html, body{ height:100%; }
    body{
      margin:0;
      font-family: "Pretendard Variable", Pretendard, ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, "Noto Sans KR", Arial, sans-serif;
      color: var(--text);
      background:
        radial-gradient(900px 500px at 20% 0%, rgba(98, 142, 255, .22), transparent 60%),
        radial-gradient(900px 500px at 95% 10%, rgba(150, 255, 199, .24), transparent 60%),
        radial-gradient(700px 420px at 50% 100%, rgba(255, 214, 102, .18), transparent 65%),
        var(--bg);
    }

    .app{ display:flex; flex-direction:column; min-height:100%; }

    .header{
      position: sticky; top: 0; z-index: 10;
      background: rgba(255,255,255,.70);
      backdrop-filter: blur(10px);
      border-bottom: 1px solid var(--line);
    }
    .header-inner{
      max-width: 1200px; margin: 0 auto; padding: 14px 18px;
      display:flex; align-items:center; justify-content:space-between; gap: 12px;
    }
    .brand{ 
        display:flex; 
        align-items:center; 
        gap:10px; 
        font-weight: 700; 
    }
    .brand:hover {
        cursor: pointer;
    }
    .brand-badge{
      width: 34px; height: 34px; border-radius: 10px;
      background: linear-gradient(135deg, rgba(98,142,255,.9), rgba(150,255,199,.7));
      box-shadow: 0 8px 18px rgba(0,0,0,.10);
    }
    .brand small{ display:block; font-weight: 500; color: var(--muted); margin-top: 2px; }

    .btn{
      appearance:none;
      border: 1px solid var(--line);
      background: var(--panel);
      color: var(--text);
      padding: 10px 14px;
      border-radius: 12px;
      cursor:pointer;
      text-decoration:none;
      display:inline-flex;
      align-items:center;
      justify-content:center;
      font-weight: 600;
      transition: transform .08s ease, background .15s ease, border-color .15s ease;
      white-space: nowrap;
    }
    .btn:hover{ background: var(--panel2); border-color: rgba(16,24,40,.16); }
    .btn:active{ transform: translateY(1px); }
    .btn.primary{ border-color: rgba(98,142,255,.45); background: rgba(98,142,255,.14); }

    .content{
      max-width: 1200px; margin: 18px auto 28px; padding: 0 18px;
      display:grid; grid-template-columns: 240px 1fr; gap: 16px; flex: 1; width: 100%;
    }
    .sidebar{
      border: 1px solid var(--line);
      background: var(--panel);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 14px;
      height: fit-content;
    }
    .sidebar-title{ font-size: 13px; color: var(--muted); margin: 2px 6px 12px; }
    .nav{ display:flex; flex-direction:column; gap: 10px; }
    .nav a{
      padding: 12px 12px; border-radius: 12px;
      border: 1px solid rgba(16,24,40,.10);
      background: rgba(255,255,255,.55);
      text-decoration:none; color: var(--text); font-weight: 650;
      transition: background .15s ease, border-color .15s ease, transform .08s ease;
    }
    .nav a:hover{ background: rgba(255,255,255,.88); border-color: rgba(16,24,40,.14); }
    .nav a:active{ transform: translateY(1px); }

    .main{
      border: 1px solid var(--line);
      background: var(--panel);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 20px;
      min-height: 520px;
    }

    /* 🟢 추가: 로그인 입력 패널 */

    .login-btn {
        display:inline-block;
    }
    .header-actions {
        display:inline-block;
        margin-left: auto;
    }

    .login-panel{
    display:flex;
    align-items:center;
    gap:10px;

    opacity: 1;
    transform: translateX(0);
    overflow: visible;
    min-width: 0;
    }


    .login-panel input{
    height: 38px;
    padding: 0 12px;
    border-radius: 12px;
    border: 1px solid var(--line);
    background: rgba(255,255,255,.90);
    color: var(--text);
    outline: none;

    flex: 0 0 170px;       /* input 너비 */
    min-width: 0;
    }

    .login-panel input::placeholder{
    color: rgba(16, 24, 40, .45);
    }

    .login-panel input:focus{
    border-color: rgba(98,142,255,.45);
    box-shadow: 0 0 0 3px rgba(98,142,255,.15);
    }


    @media (max-width: 900px){
      .content{ grid-template-columns: 1fr; }
      .sidebar{ order: 2; }
      .main{ order: 1; }
    }
  </style>

  <!-- 페이지별 CSS 슬롯(필요할 때만 사용) -->
  <th:block layout:fragment="pageCss"></th:block>
</head>

<body>
  <div class="app">

    <!-- 공통 Header -->
    <header class="header">
      <div class="header-inner">
        <div class="brand" role="link" th:onclick="|location.href='@{/}'|">
          <div class="brand-badge" aria-hidden="true"></div>
          <div>
            파일 확장자 차단 서비스
            <small>플로우 개발 과제</small>
          </div>
        </div>

        <th:block th:if="${session.loginUserName == null}">
            <form th:action="@{/login}" method="post">
            <div class="header-actions">
                <div id="login-panel" class="login-panel" aria-hidden="true">
                    <input id="login-id" type="text" placeholder="아이디" name="id"/>
                    <input id="login-pw" type="password" placeholder="비밀번호" name="pwd"/>
                </div>
            </div>
            <button type="submit" class="btn primary login-btn">로그인</button>
            </form>
        </th:block>

        <th:block th:if="${session.loginUserName != null}">
            <div class="header-actions">
                <p th:text="|${session.loginUserName}님, 환영합니다.|"></p>
            </div>
            <form th:action="@{/logout}" method="get">
            <button type="submit" class="btn primary login-btn">로그아웃</button>
            </form>
        </th:block>
      </div>
    </header>

    <!-- 공통 2열 레이아웃 -->
    <div class="content">
      <aside class="sidebar">
        <div class="sidebar-title">메뉴</div>
        <nav class="nav">
          <a th:href="@{/block}">확장자 차단</a>
          <a href="#">파일 업로드</a>
          <a href="#">파일 게시판</a>
        </nav>
      </aside>

      <!-- ✅ 각 페이지가 채울 본문 슬롯 -->
      <main class="main" layout:fragment="content"></main>
    </div>
  </div>

  <!-- 페이지별 Script 슬롯(필요할 때만 사용) -->
  <th:block layout:fragment="pageScript"></th:block>

  <!-- 🟢 추가: jQuery -->
<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>

<!-- 🟢 추가: 로그인 패널 토글 스크립트 -->
<script>

</script>


</body>
</html>
